services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      # Serve the site on whatever host it is reached through (localhost, a tunnel or a preview proxy).
      WORDPRESS_CONFIG_EXTRA: |
        if ( ! empty( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) { $$_SERVER['HTTPS'] = 'on'; }
        if ( ! empty( $$_SERVER['HTTP_HOST'] ) ) {
          $$c4u_origin = ( ! empty( $$_SERVER['HTTPS'] ) && 'off' !== $$_SERVER['HTTPS'] ? 'https://' : 'http://' ) . $$_SERVER['HTTP_HOST'];
          define( 'WP_HOME', $$c4u_origin );
          define( 'WP_SITEURL', $$c4u_origin );
        }
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - wp_data:/var/www/html
      - ./theme/coffee4u:/var/www/html/wp-content/themes/coffee4u
      - ./plugin/coffee4u-core:/var/www/html/wp-content/plugins/coffee4u-core

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./theme/coffee4u:/var/www/html/wp-content/themes/coffee4u
      - ./plugin/coffee4u-core:/var/www/html/wp-content/plugins/coffee4u-core
    profiles: ["cli"]

volumes:
  db_data:
  wp_data:
